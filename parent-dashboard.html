<!-- =========================
     JAVASCRIPT
========================== -->

<script>


/* =========================
   MOBILE MENU
========================= */

const menuToggle =
    document.querySelector('#menuToggle');

const sidebar =
    document.querySelector('#sidebar');


if (menuToggle && sidebar) {

    menuToggle.addEventListener(
        'click',
        () => {

            sidebar.classList.toggle('show');

        }
    );

}


/* =========================
   PROFILE DROPDOWN
========================= */

const profileButton =
    document.querySelector('#profileButton');

const profileDropdown =
    document.querySelector('#profileDropdown');


if (
    profileButton &&
    profileDropdown
) {

    profileButton.addEventListener(
        'click',
        (event) => {

            event.stopPropagation();

            profileDropdown.classList.toggle('show');

        }
    );


    document.addEventListener(
        'click',
        (event) => {

            if (
                !profileDropdown.contains(
                    event.target
                ) &&
                !profileButton.contains(
                    event.target
                )
            ) {

                profileDropdown.classList.remove(
                    'show'
                );

            }

        }
    );

}


/* =========================
   VARIABLES
========================= */

let currentParentId = null;
let currentChildId = null;
let currentAuthUserId = null;


/* =========================
   LOAD PARENT PROFILE
========================= */

async function loadParentProfile() {

    try {

        const {
            data: authData,
            error: authError
        } =
            await supabaseClient.auth.getUser();


        if (
            authError ||
            !authData ||
            !authData.user
        ) {

            window.location.href =
                'login.html';

            return false;

        }


        currentAuthUserId =
            authData.user.id;


        const {
            data: profile,
            error: profileError
        } =
            await supabaseClient
                .from('users')
                .select(
                    'id, nama, role, auth_id'
                )
                .eq(
                    'auth_id',
                    currentAuthUserId
                )
                .maybeSingle();


        if (profileError) {
            throw profileError;
        }


        if (!profile) {

            alert(
                'Profil Orang Tua tidak ditemukan.'
            );

            window.location.href =
                'login.html';

            return false;

        }


        if (
            profile.role !==
            'orang_tua'
        ) {

            alert(
                'Halaman ini khusus untuk Orang Tua.'
            );

            window.location.href =
                'login.html';

            return false;

        }


        currentParentId =
            profile.id;


        const nama =
            profile.nama ||
            'Ayah/Bunda';


        document.getElementById(
            'profileName'
        ).textContent =
            nama;


        document.getElementById(
            'profileRole'
        ).textContent =
            'Orang Tua';


        document.getElementById(
            'profileAvatar'
        ).textContent =
            nama
                .trim()
                .charAt(0)
                .toUpperCase();


        document.getElementById(
            'welcomeTitle'
        ).textContent =
            `Selamat datang, ${nama} 👋`;


        return true;


    } catch (error) {

        console.error(
            'Gagal memuat profil:',
            error
        );

        alert(
            'Profil Orang Tua tidak dapat dimuat.'
        );

        return false;

    }

}


/* =========================
   LOAD CHILD
========================= */

async function loadChild() {

    const childCard =
        document.getElementById('childCard');


    try {

        const {
            data: children,
            error
        } =
            await supabaseClient
                .from('children')
                .select(
                    'id, nama, kelas, tahun_ajaran, tanggal_lahir'
                )
                .eq(
                    'parent_id',
                    currentParentId
                )
                .order(
                    'nama',
                    {
                        ascending: true
                    }
                );


        if (error) {
            throw error;
        }


        if (
            !children ||
            children.length === 0
        ) {

            document.getElementById(
                'childName'
            ).textContent =
                'Belum ada data anak';

            document.getElementById(
                'childClass'
            ).textContent =
                'Data siswa belum terhubung.';

            document.getElementById(
                'childAvatar'
            ).textContent =
                '?';

            return false;

        }


        /* =========================
           ANAK PERTAMA
        ========================== */

        const firstChild =
            children[0];


        currentChildId =
            firstChild.id;


        const firstName =
            String(
                firstChild.nama ||
                'Nama anak'
            ).trim();


        document.getElementById(
            'childName'
        ).textContent =
            firstName;


        document.getElementById(
            'childClass'
        ).textContent =
            firstChild.kelas
                ? `${firstChild.kelas} · TAUD SAQU DARUL IMAN`
                : 'Kelas belum tersedia';


        document.getElementById(
            'childAvatar'
        ).textContent =
            firstName
                .charAt(0)
                .toUpperCase();


        await loadAttendanceForCard(
            firstChild.id,
            document.getElementById(
                'attendanceStatus'
            ),
            document.getElementById(
                'attendanceDot'
            )
        );


        /* =========================
           ANAK KEDUA DAN SETERUSNYA
        ========================== */

        for (
            let i = 1;
            i < children.length;
            i++
        ) {

            const child =
                children[i];


            const card =
                childCard.cloneNode(true);


            card.id =
                `childCard-${i}`;


            const nameElement =
                card.querySelector(
                    '#childName'
                );


            const classElement =
                card.querySelector(
                    '#childClass'
                );


            const avatarElement =
                card.querySelector(
                    '#childAvatar'
                );


            const statusElement =
                card.querySelector(
                    '#attendanceStatus'
                );


            const dotElement =
                card.querySelector(
                    '#attendanceDot'
                );


            if (nameElement) {

                nameElement.id =
                    `childName-${i}`;

            }


            if (classElement) {

                classElement.id =
                    `childClass-${i}`;

            }


            if (avatarElement) {

                avatarElement.id =
                    `childAvatar-${i}`;

            }


            if (statusElement) {

                statusElement.id =
                    `attendanceStatus-${i}`;

            }


            if (dotElement) {

                dotElement.id =
                    `attendanceDot-${i}`;

            }


            const namaAnak =
                String(
                    child.nama ||
                    'Nama anak'
                ).trim();


            if (nameElement) {

                nameElement.textContent =
                    namaAnak;

            }


            if (classElement) {

                classElement.textContent =
                    child.kelas
                        ? `${child.kelas} · TAUD SAQU DARUL IMAN`
                        : 'Kelas belum tersedia';

            }


            if (avatarElement) {

                avatarElement.textContent =
                    namaAnak
                        .charAt(0)
                        .toUpperCase();

            }


            await loadAttendanceForCard(
                child.id,
                statusElement,
                dotElement
            );


            childCard.parentNode.appendChild(
                card
            );

        }


        /* =========================
           NOTIFIKASI
           TETAP MENGGUNAKAN ANAK PERTAMA
        ========================== */

        await loadShortcutNotifications();


        return true;


    } catch (error) {

        console.error(
            'Gagal memuat data anak:',
            error
        );


        document.getElementById(
            'childName'
        ).textContent =
            'Gagal memuat data';


        document.getElementById(
            'childClass'
        ).textContent =
            'Silakan refresh halaman.';


        document.getElementById(
            'childAvatar'
        ).textContent =
            '?';


        return false;

    }

}


/* =========================
   ATTENDANCE UNTUK SETIAP ANAK
========================= */

async function loadAttendanceForCard(
    childId,
    statusElement,
    dot
) {

    if (
        !childId ||
        !statusElement ||
        !dot
    ) {
        return;
    }


    const today =
        getToday();


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from('attendance')
                .select(
                    'status, keterangan'
                )
                .eq(
                    'child_id',
                    childId
                )
                .eq(
                    'tanggal',
                    today
                )
                .maybeSingle();


        if (error) {
            throw error;
        }


        if (!data) {

            statusElement.textContent =
                'Belum diisi';

            dot.style.background =
                '#B0AAA3';

            return;

        }


        statusElement.textContent =
            getAttendanceLabel(
                data.status
            );


        if (
            data.status === 'hadir'
        ) {

            dot.style.background =
                '#43A047';

        } else if (
            data.status === 'izin'
        ) {

            dot.style.background =
                '#E0A100';

        } else if (
            data.status === 'sakit'
        ) {

            dot.style.background =
                '#E67E22';

        } else {

            dot.style.background =
                '#C0392B';

        }


    } catch (error) {

        console.error(
            'Gagal memuat absensi:',
            error
        );


        statusElement.textContent =
            '-';

    }

}


/* =========================
   TODAY ATTENDANCE
========================= */

async function loadTodayAttendance() {

    if (!currentChildId) {
        return;
    }


    const today =
        getToday();


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from('attendance')
                .select(
                    'status, keterangan'
                )
                .eq(
                    'child_id',
                    currentChildId
                )
                .eq(
                    'tanggal',
                    today
                )
                .maybeSingle();


        if (error) {
            throw error;
        }


        const statusElement =
            document.getElementById(
                'attendanceStatus'
            );


        const dot =
            document.getElementById(
                'attendanceDot'
            );


        if (!data) {

            statusElement.textContent =
                'Belum diisi';

            dot.style.background =
                '#B0AAA3';

            return;

        }


        statusElement.textContent =
            getAttendanceLabel(
                data.status
            );


        if (
            data.status ===
            'hadir'
        ) {

            dot.style.background =
                '#43A047';

        } else if (
            data.status ===
            'izin'
        ) {

            dot.style.background =
                '#E0A100';

        } else if (
            data.status ===
            'sakit'
        ) {

            dot.style.background =
                '#E67E22';

        } else {

            dot.style.background =
                '#C0392B';

        }


    } catch (error) {

        console.error(
            'Gagal memuat absensi:',
            error
        );


        document.getElementById(
            'attendanceStatus'
        ).textContent =
            '-';

    }

}


/* =========================
   LOAD SHORTCUT NOTIFICATIONS
========================= */

async function loadShortcutNotifications() {

    await loadCommunicationBadge();

    await loadAnnouncementBadge();

    await loadLearningBadge();

    updateTopNotification();

}


/* =========================
   GET READ NOTIFICATION IDS
========================= */

async function getReadNotificationIds(
    notificationType
) {

    if (!currentAuthUserId) {
        return new Set();
    }


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from('notification_reads')
                .select(
                    'reference_id'
                )
                .eq(
                    'user_id',
                    currentAuthUserId
                )
                .eq(
                    'notification_type',
                    notificationType
                );


        if (error) {
            throw error;
        }


        return new Set(
            (data || []).map(
                item =>
                    item.reference_id
            )
        );


    } catch (error) {

        console.error(
            'Gagal membaca status notifikasi:',
            error
        );


        return new Set();

    }

}


/* =========================
   KOMUNIKASI
========================= */

async function loadCommunicationBadge() {

    if (
        !currentParentId ||
        !currentChildId
    ) {
        return;
    }


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from('parent_notes')
                .select(
                    'id, status, tanggapan_guru'
                )
                .eq(
                    'parent_id',
                    currentParentId
                )
                .eq(
                    'child_id',
                    currentChildId
                )
                .not(
                    'tanggapan_guru',
                    'is',
                    null
                )
                .in(
                    'status',
                    [
                        'ditanggapi',
                        'selesai'
                    ]
                );


        if (error) {
            throw error;
        }


        const readIds =
            await getReadNotificationIds(
                'komunikasi'
            );


        const unread =
            (data || []).filter(
                item =>
                    !readIds.has(
                        item.id
                    )
            );


        setBadge(
            'komunikasiBadge',
            unread.length
        );


    } catch (error) {

        console.error(
            'Gagal memuat notifikasi komunikasi:',
            error
        );


        setBadge(
            'komunikasiBadge',
            0
        );

    }

}


/* =========================
   PENGUMUMAN
========================= */

async function loadAnnouncementBadge() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from('announcements')
                .select(
                    'id'
                )
                .order(
                    'created_at',
                    {
                        ascending: false
                    }
                );


        if (error) {
            throw error;
        }


        const readIds =
            await getReadNotificationIds(
                'pengumuman'
            );


        const unread =
            (data || []).filter(
                item =>
                    !readIds.has(
                        item.id
                    )
            );


        setBadge(
            'pengumumanBadge',
            unread.length
        );


    } catch (error) {

        console.error(
            'Gagal memuat notifikasi pengumuman:',
            error
        );


        setBadge(
            'pengumumanBadge',
            0
        );

    }

}


/* =========================
   PEMBELAJARAN HARI INI
========================= */

async function loadLearningBadge() {

    if (!currentChildId) {
        return;
    }


    try {

        const today =
            getToday();


        const readKey =
            `learning_read_${currentChildId}_${today}`;


        const alreadyRead =
            localStorage.getItem(
                readKey
            );


        if (
            alreadyRead === 'true'
        ) {

            setBadge(
                'pembelajaranBadge',
                0
            );

            return;

        }


        const {
            data,
            error
        } =
            await supabaseClient
                .from('daily_reports')
                .select(
                    'id'
                )
                .eq(
                    'child_id',
                    currentChildId
                )
                .eq(
                    'tanggal',
                    today
                )
                .maybeSingle();


        if (error) {
            throw error;
        }


        setBadge(
            'pembelajaranBadge',
            data ? 1 : 0
        );


    } catch (error) {

        console.error(
            'Gagal memuat notifikasi pembelajaran:',
            error
        );

    }

}


/* =========================
   MARK NOTIFICATIONS AS READ
========================= */

async function markNotificationsAsRead(
    notificationType,
    referenceIds
) {

    if (
        !currentAuthUserId ||
        !referenceIds ||
        referenceIds.length === 0
    ) {
        return;
    }


    try {

        const rows =
            referenceIds.map(
                referenceId => ({

                    user_id:
                        currentAuthUserId,

                    notification_type:
                        notificationType,

                    reference_id:
                        referenceId

                })
            );


        const {
            error
        } =
            await supabaseClient
                .from('notification_reads')
                .insert(rows);


        if (
            error &&
            error.code !== '23505'
        ) {
            throw error;
        }


    } catch (error) {

        console.error(
            'Gagal menyimpan notifikasi dibaca:',
            error
        );

    }

}


/* =========================
   MARK ONE CATEGORY AS READ
========================= */

async function markShortcutAsRead(
    notificationType
) {

    if (!currentAuthUserId) {
        return;
    }


    try {

        let referenceIds = [];


        /* =====================
           KOMUNIKASI
        ====================== */

        if (
            notificationType ===
            'komunikasi'
        ) {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from('parent_notes')
                    .select(
                        'id'
                    )
                    .eq(
                        'parent_id',
                        currentParentId
                    )
                    .eq(
                        'child_id',
                        currentChildId
                    )
                    .not(
                        'tanggapan_guru',
                        'is',
                        null
                    )
                    .in(
                        'status',
                        [
                            'ditanggapi',
                            'selesai'
                        ]
                    );


            if (error) {
                throw error;
            }


            referenceIds =
                (data || []).map(
                    item => item.id
                );

        }


        /* =====================
           PENGUMUMAN
        ====================== */

        if (
            notificationType ===
            'pengumuman'
        ) {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from('announcements')
                    .select(
                        'id'
                    );


            if (error) {
                throw error;
            }


            referenceIds =
                (data || []).map(
                    item => item.id
                );

        }


        /* =====================
           PEMBELAJARAN
        ====================== */

        if (
            notificationType ===
            'pembelajaran'
        ) {

            const today =
                getToday();


            const readKey =
                `learning_read_${currentChildId}_${today}`;


            localStorage.setItem(
                readKey,
                'true'
            );


            setBadge(
                'pembelajaranBadge',
                0
            );


            updateTopNotification();

            return;

        }


        await markNotificationsAsRead(
            notificationType,
            referenceIds
        );


        /* =========================
           HILANGKAN BADGE
        ========================== */

        if (
            notificationType ===
            'komunikasi'
        ) {

            setBadge(
                'komunikasiBadge',
                0
            );

        }


        if (
            notificationType ===
            'pengumuman'
        ) {

            setBadge(
                'pengumumanBadge',
                0
            );

        }


        if (
            notificationType ===
            'pembelajaran'
        ) {

            setBadge(
                'pembelajaranBadge',
                0
            );

        }


        updateTopNotification();


    } catch (error) {

        console.error(
            'Gagal menandai notifikasi:',
            error
        );

    }

}


/* =========================
   SHORTCUT CLICK EVENTS
========================= */

document
    .querySelectorAll(
        '.dashboard-shortcut[data-notification-type]'
    )
    .forEach(
        shortcut => {

            shortcut.addEventListener(
                'click',
                () => {

                    const type =
                        shortcut.dataset
                            .notificationType;


                    markShortcutAsRead(
                        type
                    );

                }
            );

        }
    );


/* =========================
   TOPBAR NOTIFICATION
========================= */

function updateTopNotification() {

    const komunikasiBadge =
        document.getElementById(
            'komunikasiBadge'
        );


    const pengumumanBadge =
        document.getElementById(
            'pengumumanBadge'
        );


    const pembelajaranBadge =
        document.getElementById(
            'pembelajaranBadge'
        );


    const hasUnread =
        komunikasiBadge?.classList.contains(
            'show'
        ) ||
        pengumumanBadge?.classList.contains(
            'show'
        ) ||
        pembelajaranBadge?.classList.contains(
            'show'
        );


    const notificationDot =
        document.getElementById(
            'notificationDot'
        );


    if (notificationDot) {

        notificationDot.style.display =
            hasUnread
                ? 'block'
                : 'none';

    }

}


/* =========================
   BADGE
========================= */

function setBadge(
    elementId,
    count
) {

    const badge =
        document.getElementById(
            elementId
        );


    if (!badge) {
        return;
    }


    if (count > 0) {

        badge.textContent =
            count > 99
                ? '99+'
                : count;


        badge.classList.add(
            'show'
        );

    } else {

        badge.textContent =
            '';


        badge.classList.remove(
            'show'
        );

    }

}


/* =========================
   DATE HELPERS
========================= */

function getToday() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            '0'
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            '0'
        );


    return `${year}-${month}-${day}`;

}


function getTomorrow() {

    const tomorrow =
        new Date();


    tomorrow.setDate(
        tomorrow.getDate() + 1
    );


    const year =
        tomorrow.getFullYear();


    const month =
        String(
            tomorrow.getMonth() + 1
        ).padStart(
            2,
            '0'
        );


    const day =
        String(
            tomorrow.getDate()
        ).padStart(
            2,
            '0'
        );


    return `${year}-${month}-${day}`;

}


/* =========================
   ATTENDANCE LABEL
========================= */

function getAttendanceLabel(
    status
) {

    const labels = {

        hadir: 'Hadir',
        izin: 'Izin',
        sakit: 'Sakit',
        alpa: 'Alpa'

    };


    return (
        labels[status] ||
        status
    );

}


/* =========================
   INIT
========================= */

async function initDashboard() {

    const profileLoaded =
        await loadParentProfile();


    if (!profileLoaded) {
        return;
    }


    await loadChild();

}


initDashboard();

</script>
