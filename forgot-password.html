<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lupa Password | TAUD SAQU DARUL IMAN</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- LOGO -->
        <div class="login-logo">
            <img
                src="images/logo.png"
                alt="Logo TAUD SAQU DARUL IMAN"
            >
        </div>

        <!-- JUDUL -->
        <h1>Lupa Password?</h1>

        <p class="login-subtitle">
            Masukkan email yang terdaftar pada
            TAUD SAQU DARUL IMAN School Connect.
        </p>

        <!-- FORM -->
        <form id="forgotPasswordForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Masukkan email"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-button">
                Kirim Link Reset Password
            </button>

        </form>

        <!-- PESAN -->
        <p
            id="message"
            style="display: none; margin-top: 15px;">
        </p>

        <!-- KEMBALI -->
        <a
            href="login.html"
            class="back-home">
            ← Kembali ke Login
        </a>

    </div>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script>
        const forgotPasswordForm =
            document.querySelector('#forgotPasswordForm');

        const message =
            document.querySelector('#message');

        forgotPasswordForm.addEventListener('submit', async (e) => {

            e.preventDefault();

            const email =
                document.querySelector('#email').value.trim();

            message.style.display = 'none';

            const { error } =
                await supabaseClient.auth.resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                            'https://puspitarl.github.io/school-connect/reset-password.html'
                    }
                );

            if (error) {

                message.style.display = 'block';
                message.textContent =
                    'Gagal mengirim link reset password: ' +
                    error.message;

                return;
            }

            message.style.display = 'block';

            message.textContent =
                'Link reset password sudah dikirim. Silakan cek email Anda.';

            forgotPasswordForm.reset();

        });
    </script>

</body>

</html>
