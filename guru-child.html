<style>
    /* =========================
       PAGE HEADER
    ========================== */

    .page-header {
        margin-bottom: 25px;
    }

    .page-header h1 {
        margin: 0 0 6px;
        font-size: 26px;
        color: var(--text);
    }

    .page-header p {
        margin: 0;
        color: var(--text-light);
        font-size: 14px;
    }


    /* =========================
       CHILDREN GRID
    ========================== */

    .children-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
    }


    /* =========================
       STUDENT CARD
    ========================== */

    .student-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px;
        transition: 0.2s ease;
    }

    .student-card:hover {
        transform: translateY(-3px);
        border-color: var(--orange);
        box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }


    .student-top {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
    }


    .student-avatar {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: var(--orange-light);
        color: var(--orange-dark);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
        flex-shrink: 0;
    }


    .student-info {
        min-width: 0;
    }


    .student-info .label {
        display: block;
        font-size: 11px;
        color: var(--text-light);
        letter-spacing: 0.5px;
        margin-bottom: 3px;
    }


    .student-info h2 {
        margin: 0 0 4px;
        font-size: 19px;
        color: var(--text);
    }


    .student-info p {
        margin: 0;
        font-size: 13px;
        color: var(--text-light);
    }


    /* =========================
       DETAILS
    ========================== */

    .student-details {
        border-top: 1px solid var(--border);
        padding-top: 15px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }


    .detail-box {
        background: var(--ivory);
        border-radius: 12px;
        padding: 12px;
    }


    .detail-box span {
        display: block;
        font-size: 11px;
        color: var(--text-light);
        margin-bottom: 4px;
    }


    .detail-box strong {
        font-size: 13px;
        color: var(--text);
    }


    /* =========================
       ACTIONS
    ========================== */

    .student-actions {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }


    .student-actions a {
        flex: 1;
        text-align: center;
        padding: 10px 12px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        background: var(--orange-light);
        color: var(--orange-dark);
        transition: 0.2s ease;
    }


    .student-actions a:hover {
        background: var(--orange);
        color: var(--white);
    }


    /* =========================
       EMPTY / ERROR
    ========================== */

    .empty-state {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 40px 20px;
        text-align: center;
        color: var(--text-light);
        grid-column: 1 / -1;
    }


    .empty-state strong {
        display: block;
        color: var(--text);
        margin-bottom: 6px;
    }


    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 768px) {

        .children-grid {
            grid-template-columns: 1fr;
        }

        .page-header h1 {
            font-size: 22px;
        }

    }


    @media (max-width: 480px) {

        .student-card {
            padding: 16px;
        }

        .student-details {
            grid-template-columns: 1fr;
        }

        .student-actions {
            flex-direction: column;
        }

    }
</style>

<!-- =========================
     MOBILE MENU
========================== -->

<script>

    const menuToggle =
        document.querySelector('.menu-toggle');

    const sidebar =
        document.querySelector('.sidebar');


    if (menuToggle && sidebar) {

        menuToggle.addEventListener(
            'click',
            () => {

                sidebar.classList.toggle('show');

            }
        );

    }

</script>



<!-- =========================
     PROFILE DROPDOWN
========================== -->

<script>

    const profileButton =
        document.querySelector('#profileButton');

    const profileDropdown =
        document.querySelector('#profileDropdown');


    if (
        profileButton &&
        profileDropdown
    ) {

        profileButton.addEventListener(
            'click',
            (event) => {

                event.stopPropagation();

                profileDropdown.classList.toggle(
                    'show'
                );

            }
        );


        document.addEventListener(
            'click',
            (event) => {

                if (
                    !profileDropdown.contains(
                        event.target
                    ) &&
                    !profileButton.contains(
                        event.target
                    )
                ) {

                    profileDropdown.classList.remove(
                        'show'
                    );

                }

            }
        );

    }

</script>



<!-- =========================
     LOAD GURU PROFILE
========================== -->

<script>

    async function loadGuruProfile() {

        try {

            const {
                data: { user },
                error: authError
            } =
                await supabaseClient.auth.getUser();


            if (authError) {

                console.error(
                    'Gagal mengambil user:',
                    authError
                );

                return;

            }


            if (!user) {

                window.location.href =
                    'login.html';

                return;

            }


            const {
                data: profile,
                error
            } =
                await supabaseClient
                    .from('users')
                    .select(
                        'nama, role'
                    )
                    .eq(
                        'auth_id',
                        user.id
                    )
                    .maybeSingle();


            if (error) {

                console.error(
                    'Gagal mengambil profil Guru:',
                    error
                );

                return;

            }


            if (!profile) {

                console.error(
                    'Profil Guru tidak ditemukan.'
                );

                return;

            }


            /*
             * PASTIKAN ROLE GURU
             */

            if (profile.role !== 'guru') {

                alert(
                    'Akses hanya untuk akun Guru.'
                );

                window.location.href =
                    'login.html';

                return;

            }


            const nama =
                profile.nama || 'Guru';


            const guruName =
                document.querySelector(
                    '#guruName'
                );


            const guruAvatar =
                document.querySelector(
                    '#guruAvatar'
                );


            const guruRole =
                document.querySelector(
                    '#guruRole'
                );


            if (guruName) {

                guruName.textContent =
                    nama;

            }


            if (guruAvatar) {

                guruAvatar.textContent =
                    nama
                        .trim()
                        .charAt(0)
                        .toUpperCase();

            }


            if (guruRole) {

                guruRole.textContent =
                    'Guru';

            }

        }

        catch (error) {

            console.error(
                'Terjadi kesalahan profil Guru:',
                error
            );

        }

    }


    loadGuruProfile();

</script>



<!-- =========================
     LOAD CHILDREN
========================== -->

<script>

    async function loadChildren() {

        const childrenList =
            document.querySelector(
                '#childrenList'
            );


        if (!childrenList) {
            return;
        }


        try {

            const {
                data: children,
                error
            } =
                await supabaseClient
                    .from('children')
                    .select(
                        'id, nama, kelas, tahun_ajaran'
                    )
                    .order(
                        'nama',
                        {
                            ascending: true
                        }
                    );


            if (error) {

                throw error;

            }


            if (
                !children ||
                children.length === 0
            ) {

                childrenList.innerHTML = `

                    <div class="empty-state">

                        <strong>
                            Belum ada data anak
                        </strong>

                        <span>
                            Data anak belum tersedia.
                        </span>

                    </div>

                `;

                return;

            }


            childrenList.innerHTML = '';


            children.forEach(
                (child) => {


                    const card =
                        document.createElement(
                            'div'
                        );

                    card.className =
                        'student-card';


                    /* AVATAR */

                    const studentTop =
                        document.createElement(
                            'div'
                        );

                    studentTop.className =
                        'student-top';


                    const avatar =
                        document.createElement(
                            'div'
                        );

                    avatar.className =
                        'student-avatar';


                    const nama =
                        (
                            child.nama ||
                            '?'
                        ).trim();


                    avatar.textContent =
                        nama
                            .charAt(0)
                            .toUpperCase();


                    /* INFO */

                    const info =
                        document.createElement(
                            'div'
                        );

                    info.className =
                        'student-info';


                    const label =
                        document.createElement(
                            'span'
                        );

                    label.className =
                        'label';

                    label.textContent =
                        'DATA ANAK';


                    const name =
                        document.createElement(
                            'h2'
                        );

                    name.textContent =
                        child.nama ||
                        'Tanpa Nama';


                    const classInfo =
                        document.createElement(
                            'p'
                        );

                    classInfo.textContent =
                        child.kelas ||
                        '-';


                    info.appendChild(label);
                    info.appendChild(name);
                    info.appendChild(classInfo);


                    studentTop.appendChild(
                        avatar
                    );

                    studentTop.appendChild(
                        info
                    );


                    /* DETAILS */

                    const details =
                        document.createElement(
                            'div'
                        );

                    details.className =
                        'student-details';


                    const yearBox =
                        document.createElement(
                            'div'
                        );

                    yearBox.className =
                        'detail-box';


                    const yearLabel =
                        document.createElement(
                            'span'
                        );

                    yearLabel.textContent =
                        'Tahun Ajaran';


                    const yearValue =
                        document.createElement(
                            'strong'
                        );

                    yearValue.textContent =
                        child.tahun_ajaran ||
                        '-';


                    yearBox.appendChild(
                        yearLabel
                    );

                    yearBox.appendChild(
                        yearValue
                    );


                    const statusBox =
                        document.createElement(
                            'div'
                        );

                    statusBox.className =
                        'detail-box';


                    const statusLabel =
                        document.createElement(
                            'span'
                        );

                    statusLabel.textContent =
                        'Status';


                    const statusValue =
                        document.createElement(
                            'strong'
                        );

                    statusValue.textContent =
                        'Aktif';


                    statusBox.appendChild(
                        statusLabel
                    );

                    statusBox.appendChild(
                        statusValue
                    );


                    details.appendChild(
                        yearBox
                    );

                    details.appendChild(
                        statusBox
                    );


                    /* ACTIONS */

                    const actions =
                        document.createElement(
                            'div'
                        );

                    actions.className =
                        'student-actions';


                    const developmentLink =
                        document.createElement(
                            'a'
                        );

                    developmentLink.href =
                        `guru-perkembangan.html?child_id=${encodeURIComponent(child.id)}`;

                    developmentLink.textContent =
                        '📊 Perkembangan';


                    const journalLink =
                        document.createElement(
                            'a'
                        );

                    journalLink.href =
                        `guru-buku-penghubung.html?child_id=${encodeURIComponent(child.id)}`;

                    journalLink.textContent =
                        '📖 Buku Penghubung';


                    actions.appendChild(
                        developmentLink
                    );

                    actions.appendChild(
                        journalLink
                    );


                    /* BUILD CARD */

                    card.appendChild(
                        studentTop
                    );

                    card.appendChild(
                        details
                    );

                    card.appendChild(
                        actions
                    );


                    childrenList.appendChild(
                        card
                    );

                }
            );

        }

        catch (error) {

            console.error(
                'Gagal mengambil data anak:',
                error
            );


            childrenList.innerHTML = `

                <div class="empty-state">

                    <strong>
                        Data anak gagal dimuat
                    </strong>

                    <span>
                        Silakan coba refresh halaman.
                    </span>

                </div>

            `;

        }

    }


    loadChildren();

</script>
