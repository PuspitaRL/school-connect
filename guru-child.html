    <style>
        /* =========================
           PAGE HEADER
        ========================== */

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0 0 6px;
            font-size: 26px;
            color: var(--text);
        }

        .page-header p {
            margin: 0;
            color: var(--text-light);
            font-size: 14px;
        }


        /* =========================
           CHILDREN GRID
        ========================== */

        .children-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }


        /* =========================
           STUDENT CARD
        ========================== */

        .student-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            transition: 0.2s ease;
        }

        .student-card:hover {
            transform: translateY(-2px);
            border-color: var(--orange);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }


        /* =========================
           STUDENT HEADER
        ========================== */

        .student-top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }


        .student-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--orange-light);
            color: var(--orange-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            flex-shrink: 0;
        }


        .student-info {
            min-width: 0;
        }


        .student-info .label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-light);
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }


        .student-info h2 {
            margin: 0 0 4px;
            font-size: 19px;
            color: var(--text);
        }


        .student-info p {
            margin: 0;
            font-size: 13px;
            color: var(--text-light);
        }


        /* =========================
           IDENTITY
        ========================== */

        .student-details {
            border-top: 1px solid var(--border);
            padding-top: 17px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }


        .detail-box {
            background: var(--ivory);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px 14px;
        }


        .detail-box span {
            display: block;
            font-size: 11px;
            color: var(--text-light);
            margin-bottom: 6px;
        }


        .detail-box strong {
            display: block;
            font-size: 14px;
            color: var(--text);
        }


        /* =========================
           EMPTY STATE
        ========================== */

        .empty-state {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 45px 20px;
            text-align: center;
            color: var(--text-light);
            grid-column: 1 / -1;
        }


        .empty-state strong {
            display: block;
            color: var(--text);
            margin-bottom: 6px;
            font-size: 15px;
        }


        .empty-state span {
            font-size: 13px;
        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 768px) {

            .children-grid {
                grid-template-columns: 1fr;
            }

            .page-header h1 {
                font-size: 22px;
            }

        }


        @media (max-width: 480px) {

            .student-card {
                padding: 18px;
            }

            .student-details {
                grid-template-columns: 1fr;
            }

        }
    </style>

    <script>

        const menuToggle =
            document.getElementById('menuToggle');

        const sidebar =
            document.getElementById('sidebar');


        if (menuToggle && sidebar) {

            menuToggle.addEventListener(
                'click',
                () => {
                    sidebar.classList.toggle('show');
                }
            );

        }

    </script>


    <!-- =========================
         PROFILE DROPDOWN
    ========================== -->

    <script>

        const profileButton =
            document.getElementById('profileButton');

        const profileDropdown =
            document.getElementById('profileDropdown');


        if (
            profileButton &&
            profileDropdown
        ) {

            profileButton.addEventListener(
                'click',
                (event) => {

                    event.stopPropagation();

                    profileDropdown.classList.toggle('show');

                }
            );


            document.addEventListener(
                'click',
                (event) => {

                    if (
                        !profileDropdown.contains(event.target) &&
                        !profileButton.contains(event.target)
                    ) {

                        profileDropdown.classList.remove('show');

                    }

                }
            );

        }

    </script>


    <!-- =========================
         LOAD GURU PROFILE
    ========================== -->

    <script>

        async function loadGuruProfile() {

            try {

                const {
                    data: authData,
                    error: authError
                } =
                    await supabaseClient.auth.getUser();


                if (
                    authError ||
                    !authData ||
                    !authData.user
                ) {

                    window.location.href =
                        'login.html';

                    return;

                }


                const user =
                    authData.user;


                const {
                    data: profile,
                    error: profileError
                } =
                    await supabaseClient
                        .from('users')
                        .select(
                            'id, nama, role, auth_id'
                        )
                        .eq(
                            'auth_id',
                            user.id
                        )
                        .maybeSingle();


                if (profileError) {

                    console.error(
                        'Gagal mengambil profil Guru:',
                        profileError
                    );

                    return;

                }


                if (!profile) {

                    window.location.href =
                        'login.html';

                    return;

                }


                if (profile.role !== 'guru') {

                    alert(
                        'Halaman ini hanya dapat diakses oleh Guru.'
                    );

                    window.location.href =
                        'login.html';

                    return;

                }


                const nama =
                    profile.nama || 'Guru';


                const guruName =
                    document.getElementById(
                        'guruName'
                    );

                const guruAvatar =
                    document.getElementById(
                        'guruAvatar'
                    );

                const guruRole =
                    document.getElementById(
                        'guruRole'
                    );


                if (guruName) {
                    guruName.textContent = nama;
                }


                if (guruAvatar) {

                    guruAvatar.textContent =
                        nama
                            .trim()
                            .charAt(0)
                            .toUpperCase();

                }


                if (guruRole) {
                    guruRole.textContent = 'Guru';
                }

            }

            catch (error) {

                console.error(
                    'Terjadi kesalahan profil Guru:',
                    error
                );

            }

        }


        loadGuruProfile();

    </script>


    <!-- =========================
         HITUNG USIA
    ========================== -->

    <script>

        function calculateAge(
            birthDate
        ) {

            if (!birthDate) {
                return null;
            }


            const today =
                new Date();


            const birth =
                new Date(
                    birthDate + 'T00:00:00'
                );


            let age =
                today.getFullYear() -
                birth.getFullYear();


            const monthDifference =
                today.getMonth() -
                birth.getMonth();


            if (
                monthDifference < 0 ||
                (
                    monthDifference === 0 &&
                    today.getDate() < birth.getDate()
                )
            ) {

                age--;

            }


            return age;

        }

    </script>


    <!-- =========================
         FORMAT TANGGAL
    ========================== -->

    <script>

        function formatBirthDate(
            dateString
        ) {

            if (!dateString) {
                return '-';
            }


            const date =
                new Date(
                    dateString + 'T00:00:00'
                );


            return date.toLocaleDateString(
                'id-ID',
                {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                }
            );

        }

    </script>


    <!-- =========================
         LOAD CHILDREN
    ========================== -->

    <script>

        async function loadChildren() {

            const childrenList =
                document.getElementById(
                    'childrenList'
                );


            if (!childrenList) {
                return;
            }


            try {

                const {
                    data: children,
                    error
                } =
                    await supabaseClient
                        .from('children')
                        .select(
                            'id, nama, kelas, tanggal_lahir'
                        )
                        .order(
                            'nama',
                            {
                                ascending: true
                            }
                        );


                if (error) {
                    throw error;
                }


                if (
                    !children ||
                    children.length === 0
                ) {

                    childrenList.innerHTML = `

                        <div class="empty-state">

                            <strong>
                                Belum ada data siswa
                            </strong>

                            <span>
                                Data siswa belum tersedia.
                            </span>

                        </div>

                    `;

                    return;

                }


                childrenList.innerHTML = '';


                children.forEach(
                    (child) => {

                        const card =
                            document.createElement(
                                'div'
                            );

                        card.className =
                            'student-card';


                        // =====================
                        // HEADER
                        // =====================

                        const studentTop =
                            document.createElement(
                                'div'
                            );

                        studentTop.className =
                            'student-top';


                        const avatar =
                            document.createElement(
                                'div'
                            );

                        avatar.className =
                            'student-avatar';


                        const nama =
                            (
                                child.nama || '?'
                            ).trim();


                        avatar.textContent =
                            nama
                                .charAt(0)
                                .toUpperCase();


                        const info =
                            document.createElement(
                                'div'
                            );

                        info.className =
                            'student-info';


                        const label =
                            document.createElement(
                                'span'
                            );

                        label.className =
                            'label';

                        label.textContent =
                            'DATA PESERTA DIDIK';


                        const name =
                            document.createElement(
                                'h2'
                            );

                        name.textContent =
                            child.nama ||
                            'Tanpa Nama';


                        const classInfo =
                            document.createElement(
                                'p'
                            );

                        classInfo.textContent =
                            child.kelas ||
                            '-';


                        info.appendChild(label);
                        info.appendChild(name);
                        info.appendChild(classInfo);


                        studentTop.appendChild(avatar);
                        studentTop.appendChild(info);


                        // =====================
                        // IDENTITY DETAILS
                        // =====================

                        const details =
                            document.createElement(
                                'div'
                            );

                        details.className =
                            'student-details';


                        // USIA
                        const ageBox =
                            document.createElement(
                                'div'
                            );

                        ageBox.className =
                            'detail-box';


                        const ageLabel =
                            document.createElement(
                                'span'
                            );

                        ageLabel.textContent =
                            'Usia';


                        const ageValue =
                            document.createElement(
                                'strong'
                            );


                        const age =
                            calculateAge(
                                child.tanggal_lahir
                            );


                        ageValue.textContent =
                            age !== null
                                ? `${age} tahun`
                                : '-';


                        ageBox.appendChild(ageLabel);
                        ageBox.appendChild(ageValue);


                        // TANGGAL LAHIR
                        const birthBox =
                            document.createElement(
                                'div'
                            );

                        birthBox.className =
                            'detail-box';


                        const birthLabel =
                            document.createElement(
                                'span'
                            );

                        birthLabel.textContent =
                            'Tanggal Lahir';


                        const birthValue =
                            document.createElement(
                                'strong'
                            );

                        birthValue.textContent =
                            formatBirthDate(
                                child.tanggal_lahir
                            );


                        birthBox.appendChild(
                            birthLabel
                        );

                        birthBox.appendChild(
                            birthValue
                        );


                        details.appendChild(ageBox);
                        details.appendChild(birthBox);


                        // =====================
                        // BUILD CARD
                        // =====================

                        card.appendChild(
                            studentTop
                        );

                        card.appendChild(
                            details
                        );


                        childrenList.appendChild(
                            card
                        );

                    }
                );

            }

            catch (error) {

                console.error(
                    'Gagal mengambil data siswa:',
                    error
                );


                childrenList.innerHTML = `

                    <div class="empty-state">

                        <strong>
                            Data siswa gagal dimuat
                        </strong>

                        <span>
                            Silakan coba refresh halaman.
                        </span>

                    </div>

                `;

            }

        }


        loadChildren();

    </script>
