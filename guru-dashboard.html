<script>

    let currentGuruId = null;
    let allChildrenData = [];


    /* =====================================
       TODAY
    ===================================== */

    function getTodayLocal() {

        const now = new Date();

        const year =
            now.getFullYear();

        const month =
            String(now.getMonth() + 1)
                .padStart(2, '0');

        const day =
            String(now.getDate())
                .padStart(2, '0');

        return `${year}-${month}-${day}`;
    }


    /* =====================================
       LOAD GURU PROFILE
    ===================================== */

    async function loadGuruProfile() {

        const {
            data: authData,
            error: authError
        } = await supabaseClient.auth.getUser();


        if (
            authError ||
            !authData ||
            !authData.user
        ) {

            window.location.href =
                'login.html';

            return false;
        }


        const {
            data: profile,
            error: profileError
        } = await supabaseClient
            .from('users')
            .select('id, nama, role, auth_id')
            .eq(
                'auth_id',
                authData.user.id
            )
            .maybeSingle();


        if (profileError) {

            console.error(
                'Profile error:',
                profileError
            );

            alert(
                'Gagal memuat profil Guru.'
            );

            return false;
        }


        if (!profile) {

            alert(
                'Profil pengguna tidak ditemukan.'
            );

            window.location.href =
                'login.html';

            return false;
        }


        if (profile.role !== 'guru') {

            alert(
                'Halaman ini hanya dapat diakses oleh Guru.'
            );

            window.location.href =
                'login.html';

            return false;
        }


        currentGuruId =
            profile.id;


        const namaGuru =
            profile.nama || 'Guru';


        document.getElementById(
            'guruName'
        ).textContent =
            namaGuru;


        document.getElementById(
            'guruRole'
        ).textContent =
            'Guru';


        document.getElementById(
            'guruAvatar'
        ).textContent =
            namaGuru
                .trim()
                .charAt(0)
                .toUpperCase();


        document.getElementById(
            'welcomeTitle'
        ).textContent =
            `Selamat datang, ${namaGuru}`;


        return true;
    }


    /* =====================================
       CALCULATE AGE
    ===================================== */

    function calculateAge(dateOfBirth) {

        if (!dateOfBirth) {
            return '-';
        }

        const birth =
            new Date(
                dateOfBirth + 'T00:00:00'
            );

        const today =
            new Date();

        let age =
            today.getFullYear() -
            birth.getFullYear();

        const monthDifference =
            today.getMonth() -
            birth.getMonth();

        if (
            monthDifference < 0 ||
            (
                monthDifference === 0 &&
                today.getDate() < birth.getDate()
            )
        ) {

            age--;

        }

        return age >= 0
            ? `${age} tahun`
            : '-';
    }


    /* =====================================
       FORMAT DATE
    ===================================== */

    function formatDate(dateValue) {

        if (!dateValue) {
            return '-';
        }

        return new Date(
            dateValue + 'T00:00:00'
        ).toLocaleDateString(
            'id-ID',
            {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            }
        );
    }


    /* =====================================
       LOAD CHILDREN
    ===================================== */

    async function loadChildren() {

        const childrenList =
            document.getElementById(
                'childrenList'
            );


        const {
            data: children,
            error
        } = await supabaseClient
            .from('children')
            .select(
                'id, nama, kelas, tahun_ajaran, tanggal_lahir'
            )
            .order(
                'nama',
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(
                'Children error:',
                error
            );

            childrenList.innerHTML = `
                <div class="empty-box">
                    Gagal memuat data siswa.
                </div>
            `;

            return [];
        }


        allChildrenData =
            children || [];


        document.getElementById(
            'totalChildren'
        ).textContent =
            allChildrenData.length;


        if (
            allChildrenData.length === 0
        ) {

            childrenList.innerHTML = `
                <div class="empty-box">
                    Belum ada data siswa.
                </div>
            `;

            return [];
        }


        childrenList.innerHTML = '';


        allChildrenData.forEach(
            child => {

                const card =
                    document.createElement(
                        'div'
                    );

                card.className =
                    'child-card';


                const initial =
                    (child.nama || 'S')
                        .trim()
                        .charAt(0)
                        .toUpperCase();


                card.innerHTML = `

                    <div class="child-avatar">
                        ${initial}
                    </div>

                    <div class="child-info">

                        <span class="small-label">
                            SISWA
                        </span>

                        <h2>
                            ${escapeHtml(
                                child.nama
                            )}
                        </h2>

                        <p>
                            ${escapeHtml(
                                child.kelas || '-'
                            )}

                            ${
                                child.tahun_ajaran
                                    ? ' • ' +
                                      escapeHtml(
                                          child.tahun_ajaran
                                      )
                                    : ''
                            }
                        </p>

                    </div>

                    <div class="child-action">

                        <button
                            type="button"
                            class="view-child-btn"
                        >
                            Lihat Data
                        </button>

                    </div>
                `;


                const button =
                    card.querySelector(
                        '.view-child-btn'
                    );


                button.addEventListener(
                    'click',
                    () => {
                        openChildProfile(
                            child.id
                        );
                    }
                );


                childrenList.appendChild(
                    card
                );

            }
        );


        return allChildrenData;
    }


    /* =====================================
       OPEN CHILD PROFILE
    ===================================== */

    async function openChildProfile(
        childId
    ) {

        const modal =
            document.getElementById(
                'childModal'
            );

        const modalBody =
            document.getElementById(
                'childModalBody'
            );


        modal.classList.add(
            'show'
        );

        modal.setAttribute(
            'aria-hidden',
            'false'
        );

        document.body.style.overflow =
            'hidden';


        modalBody.innerHTML = `
            <div class="modal-loading">
                Memuat data anak...
            </div>
        `;


        const child =
            allChildrenData.find(
                item =>
                    item.id === childId
            );


        if (!child) {

            modalBody.innerHTML = `
                <div class="empty-box">
                    Data anak tidak ditemukan.
                </div>
            `;

            return;
        }


        const initial =
            (child.nama || 'S')
                .trim()
                .charAt(0)
                .toUpperCase();


        document.getElementById(
            'modalChildAvatar'
        ).textContent =
            initial;


        document.getElementById(
            'modalChildName'
        ).textContent =
            child.nama || 'Anak';


        document.getElementById(
            'modalChildClass'
        ).textContent =
            child.kelas || '-';


        /* =================================
           30 HARI TERAKHIR
        ================================= */

        const today =
            new Date();


        const startDate =
            new Date(today);


        startDate.setDate(
            startDate.getDate() - 29
        );


        /*
         * FIX:
         * Sebelumnya kurang tanda }
         * pada template expression.
         */
        const startDateString =
            `${startDate.getFullYear()}-${String(
                startDate.getMonth() + 1
            ).padStart(2, '0')}-${String(
                startDate.getDate()
            ).padStart(2, '0')}`;


        const todayString =
            getTodayLocal();


        /* =================================
           LOAD SEMUA DETAIL SEKALIGUS
        ================================= */

        const [
            attendanceResult,
            achievementsResult,
            lessonsResult
        ] = await Promise.all([

            supabaseClient
                .from('attendance')
                .select(
                    'id, tanggal, status'
                )
                .eq(
                    'child_id',
                    child.id
                ),

            supabaseClient
                .from('achievements')
                .select(`
                    murojaah_surat,
                    mendengarkan_20x,
                    murojaah_tibyan,
                    tarbiyah
                `)
                .eq(
                    'child_id',
                    child.id
                ),

            child.kelas
                ? supabaseClient
                    .from('daily_lessons')
                    .select(
                        'tanggal, kelas, kegiatan_belajar'
                    )
                    .eq(
                        'kelas',
                        child.kelas
                    )
                    .gte(
                        'tanggal',
                        startDateString
                    )
                    .lte(
                        'tanggal',
                        todayString
                    )
                : Promise.resolve({
                    data: [],
                    error: null
                })

        ]);


        /* =================================
           ABSENSI
        ================================= */

        if (
            attendanceResult.error
        ) {

            console.error(
                'Child attendance error:',
                attendanceResult.error
            );

        }


        const attendance =
            attendanceResult.data || [];


        const totalAttendance =
            attendance.length;


        const attendanceCount = {

            hadir: 0,
            sakit: 0,
            izin: 0,
            alfa: 0

        };


        attendance.forEach(
            item => {

                const status =
                    String(
                        item.status || ''
                    )
                    .toLowerCase()
                    .trim();


                if (
                    Object.prototype.hasOwnProperty.call(
                        attendanceCount,
                        status
                    )
                ) {

                    attendanceCount[
                        status
                    ]++;

                }

            }
        );


        function attendancePercent(
            count
        ) {

            if (
                !totalAttendance
            ) {

                return 0;

            }


            return Math.round(
                (
                    count /
                    totalAttendance
                ) * 100
            );

        }


        /* =================================
           BINTANG PRESTASI
        ================================= */

        if (
            achievementsResult.error
        ) {

            console.error(
                'Achievements error:',
                achievementsResult.error
            );

        }


        const achievements =
            achievementsResult.data || [];


        let totalStars = 0;


        achievements.forEach(
            item => {

                if (
                    item.murojaah_surat
                ) {

                    totalStars++;

                }


                if (
                    item.mendengarkan_20x
                ) {

                    totalStars++;

                }


                if (
                    item.murojaah_tibyan
                ) {

                    totalStars++;

                }


                if (
                    item.tarbiyah
                ) {

                    totalStars++;

                }

            }
        );


        /* =================================
           PEMBELAJARAN
        ================================= */

        let learningPercent = 0;

        let learningDays = 0;

        const learningTotalDays =
            30;


        if (
            lessonsResult.error
        ) {

            console.error(
                'Learning error:',
                lessonsResult.error
            );

        } else {

            const lessonDates =
                new Set();


            (
                lessonsResult.data || []
            ).forEach(
                lesson => {

                    if (
                        lesson.tanggal &&
                        lesson.kegiatan_belajar &&
                        String(
                            lesson.kegiatan_belajar
                        ).trim()
                    ) {

                        lessonDates.add(
                            lesson.tanggal
                        );

                    }

                }
            );


            learningDays =
                lessonDates.size;


            learningPercent =
                Math.min(
                    100,
                    Math.round(
                        (
                            learningDays /
                            learningTotalDays
                        ) * 100
                    )
                );

        }


        /* =================================
           RENDER MODAL
        ================================= */

        modalBody.innerHTML = `

            <div class="identity-grid">

                <div class="identity-item">

                    <span>
                        Nama
                    </span>

                    <strong>
                        ${escapeHtml(
                            child.nama || '-'
                        )}
                    </strong>

                </div>


                <div class="identity-item">

                    <span>
                        Usia
                    </span>

                    <strong>
                        ${escapeHtml(
                            calculateAge(
                                child.tanggal_lahir
                            )
                        )}
                    </strong>

                </div>


                <div class="identity-item">

                    <span>
                        Tanggal Lahir
                    </span>

                    <strong>
                        ${escapeHtml(
                            formatDate(
                                child.tanggal_lahir
                            )
                        )}
                    </strong>

                </div>


                <div class="identity-item">

                    <span>
                        Kelas
                    </span>

                    <strong>
                        ${escapeHtml(
                            child.kelas || '-'
                        )}
                    </strong>

                </div>


                <div class="identity-item">

                    <span>
                        Tahun Ajaran
                    </span>

                    <strong>
                        ${escapeHtml(
                            child.tahun_ajaran || '-'
                        )}
                    </strong>

                </div>

            </div>


            <div class="profile-section">

                <div class="profile-section-title">

                    <span>⭐</span>

                    <h3>
                        Bintang Prestasi
                    </h3>

                </div>

                <div class="achievement-card">

                    <div class="achievement-number">
                        ${totalStars} ⭐
                    </div>

                    <div class="achievement-label">
                        Total bintang prestasi
                    </div>

                </div>

            </div>


            <div class="profile-section">

                <div class="profile-section-title">

                    <span>📅</span>

                    <h3>
                        Kehadiran
                    </h3>

                </div>

                <div class="attendance-grid">

                    <div class="attendance-item">

                        <strong>
                            ${attendancePercent(
                                attendanceCount.hadir
                            )}%
                        </strong>

                        <span>
                            Hadir
                        </span>

                    </div>


                    <div class="attendance-item">

                        <strong>
                            ${attendancePercent(
                                attendanceCount.sakit
                            )}%
                        </strong>

                        <span>
                            Sakit
                        </span>

                    </div>


                    <div class="attendance-item">

                        <strong>
                            ${attendancePercent(
                                attendanceCount.izin
                            )}%
                        </strong>

                        <span>
                            Izin
                        </span>

                    </div>


                    <div class="attendance-item">

                        <strong>
                            ${attendancePercent(
                                attendanceCount.alfa
                            )}%
                        </strong>

                        <span>
                            Alfa
                        </span>

                    </div>

                </div>

            </div>


            <div class="profile-section">

                <div class="profile-section-title">

                    <span>📚</span>

                    <h3>
                        Pembelajaran
                    </h3>

                </div>

                <div class="learning-card">

                    <div class="learning-top">

                        <span>
                            Pembelajaran tercatat
                            dalam 30 hari terakhir
                        </span>

                        <div class="learning-percent">
                            ${learningPercent}%
                        </div>

                    </div>

                    <div class="progress-bar">

                        <div
                            class="progress-fill"
                            style="width: ${learningPercent}%"
                        ></div>

                    </div>

                    <p class="learning-note">
                        Tercatat ${learningDays}
                        dari ${learningTotalDays}
                        hari pembelajaran.
                    </p>

                </div>

            </div>

        `;
    }


    /* =====================================
       CLOSE CHILD PROFILE
    ===================================== */

    function closeChildProfile() {

        const modal =
            document.getElementById(
                'childModal'
            );


        modal.classList.remove(
            'show'
        );


        modal.setAttribute(
            'aria-hidden',
            'true'
        );


        document.body.style.overflow =
            '';

    }


    const modalClose =
        document.getElementById(
            'modalClose'
        );


    if (modalClose) {

        modalClose.addEventListener(
            'click',
            closeChildProfile
        );

    }


    const childModal =
        document.getElementById(
            'childModal'
        );


    if (childModal) {

        childModal.addEventListener(
            'click',
            event => {

                if (
                    event.target ===
                    childModal
                ) {

                    closeChildProfile();

                }

            }
        );

    }


    document.addEventListener(
        'keydown',
        event => {

            if (
                event.key === 'Escape'
            ) {

                closeChildProfile();

            }

        }
    );


    /* =====================================
       LOAD TODAY ATTENDANCE
    ===================================== */

    async function loadTodayAttendance() {

        const today =
            getTodayLocal();


        const {
            data,
            error
        } = await supabaseClient
            .from('attendance')
            .select(
                'id, status'
            )
            .eq(
                'tanggal',
                today
            );


        if (error) {

            console.error(
                'Attendance error:',
                error
            );

            document.getElementById(
                'todayPresent'
            ).textContent =
                '—';

            return;

        }


        const hadir =
            (
                data || []
            ).filter(
                item =>
                    item.status ===
                    'hadir'
            ).length;


        document.getElementById(
            'todayPresent'
        ).textContent =
            hadir;

    }


    /* =====================================
       LOAD NEW COMMUNICATION
    ===================================== */

    async function loadNewMessages() {

        const {
            data,
            error
        } = await supabaseClient
            .from('parent_notes')
            .select(
                'id, status'
            )
            .eq(
                'status',
                'baru'
            );


        if (error) {

            console.error(
                'Parent notes error:',
                error
            );

            document.getElementById(
                'newMessages'
            ).textContent =
                '—';

            return;

        }


        document.getElementById(
            'newMessages'
        ).textContent =
            data
                ? data.length
                : 0;

    }


    /* =====================================
       ESCAPE HTML
    ===================================== */

    function escapeHtml(value) {

        return String(value)
            .replace(
                /&/g,
                '&amp;'
            )
            .replace(
                /</g,
                '&lt;'
            )
            .replace(
                />/g,
                '&gt;'
            )
            .replace(
                /"/g,
                '&quot;'
            )
            .replace(
                /'/g,
                '&#039;'
            );

    }


    /* =====================================
       PROFILE DROPDOWN
    ===================================== */

    const profileButton =
        document.getElementById(
            'profileButton'
        );


    const profileDropdown =
        document.getElementById(
            'profileDropdown'
        );


    if (
        profileButton &&
        profileDropdown
    ) {

        profileButton.addEventListener(
            'click',
            event => {

                event.stopPropagation();

                profileDropdown.classList.toggle(
                    'show'
                );

            }
        );


        document.addEventListener(
            'click',
            event => {

                if (
                    !profileDropdown.contains(
                        event.target
                    ) &&
                    !profileButton.contains(
                        event.target
                    )
                ) {

                    profileDropdown.classList.remove(
                        'show'
                    );

                }

            }
        );

    }


    /* =====================================
       MOBILE MENU
    ===================================== */

    const menuToggle =
        document.getElementById(
            'menuToggle'
        );


    const sidebar =
        document.querySelector(
            '.sidebar'
        );


    if (
        menuToggle &&
        sidebar
    ) {

        menuToggle.addEventListener(
            'click',
            () => {

                sidebar.classList.toggle(
                    'show'
                );

            }
        );

    }


    /* =====================================
       INIT
    ===================================== */

    async function initPage() {

        const guruReady =
            await loadGuruProfile();


        if (!guruReady) {
            return;
        }


        await Promise.all([

            loadChildren(),

            loadTodayAttendance(),

            loadNewMessages()

        ]);

    }


    initPage();

</script>
