```html
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buat Password Baru | TAUD SAQU DARUL IMAN</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- LOGO -->
        <div class="login-logo">
            <img
                src="images/logo.png"
                alt="Logo TAUD SAQU DARUL IMAN"
            >
        </div>

        <!-- JUDUL -->
        <h1>Buat Password Baru</h1>

        <p class="login-subtitle">
            Silakan masukkan password baru untuk akun
            TAUD SAQU DARUL IMAN School Connect.
        </p>

        <!-- FORM -->
        <form id="resetPasswordForm">

            <div class="form-group">

                <label for="password">
                    Password Baru
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password baru"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password">
                        Lihat
                    </button>

                </div>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Konfirmasi Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Masukkan kembali password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        id="toggleConfirmPassword"
                        class="toggle-password">
                        Lihat
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-button"
                id="resetButton">
                Simpan Password Baru
            </button>

        </form>


        <!-- PESAN -->
        <p
            id="message"
            style="display: none; margin-top: 15px;">
        </p>


        <!-- KEMBALI -->
        <a
            href="login.html"
            class="back-home">
            ← Kembali ke Login
        </a>

    </div>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>


    <script>

        const resetPasswordForm =
            document.querySelector('#resetPasswordForm');

        const passwordInput =
            document.querySelector('#password');

        const confirmPasswordInput =
            document.querySelector('#confirmPassword');

        const togglePassword =
            document.querySelector('#togglePassword');

        const toggleConfirmPassword =
            document.querySelector('#toggleConfirmPassword');

        const resetButton =
            document.querySelector('#resetButton');

        const message =
            document.querySelector('#message');


        /*
        ==========================================
        CEK SESSION RESET PASSWORD
        ==========================================
        */

        supabaseClient.auth.onAuthStateChange(
            async (event, session) => {

                if (event === 'PASSWORD_RECOVERY') {

                    console.log(
                        'Sesi reset password berhasil.'
                    );

                }

            }
        );


        /*
        ==========================================
        SUBMIT PASSWORD BARU
        ==========================================
        */

        resetPasswordForm.addEventListener(
            'submit',
            async (e) => {

                e.preventDefault();


                const password =
                    passwordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                /*
                CEK PASSWORD
                */

                if (password.length < 6) {

                    showMessage(
                        'Password minimal 6 karakter.',
                        true
                    );

                    return;

                }


                /*
                CEK KONFIRMASI
                */

                if (password !== confirmPassword) {

                    showMessage(
                        'Konfirmasi password tidak sama.',
                        true
                    );

                    return;

                }


                /*
                NONAKTIFKAN TOMBOL
                */

                resetButton.disabled = true;

                resetButton.textContent =
                    'Menyimpan...';


                /*
                UPDATE PASSWORD
                */

                const { error } =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });


                if (error) {

                    resetButton.disabled = false;

                    resetButton.textContent =
                        'Simpan Password Baru';

                    showMessage(
                        'Gagal mengubah password: ' +
                        error.message,
                        true
                    );

                    return;

                }


                /*
                BERHASIL
                */

                showMessage(
                    'Password berhasil diubah. Anda akan diarahkan ke halaman login.',
                    false
                );


                resetPasswordForm.reset();


                setTimeout(() => {

                    window.location.href =
                        'login.html';

                }, 2500);

            }
        );


        /*
        ==========================================
        FUNGSI PESAN
        ==========================================
        */

        function showMessage(text, isError) {

            message.style.display = 'block';

            message.textContent = text;

            if (isError) {

                message.style.color = '#b42318';

            } else {

                message.style.color = '#2e7d32';

            }

        }


        /*
        ==========================================
        TOGGLE PASSWORD
        ==========================================
        */

        togglePassword.addEventListener(
            'click',
            () => {

                if (passwordInput.type === 'password') {

                    passwordInput.type = 'text';

                    togglePassword.textContent =
                        'Sembunyikan';

                } else {

                    passwordInput.type = 'password';

                    togglePassword.textContent =
                        'Lihat';

                }

            }
        );


        /*
        ==========================================
        TOGGLE CONFIRM PASSWORD
        ==========================================
        */

        toggleConfirmPassword.addEventListener(
            'click',
            () => {

                if (
                    confirmPasswordInput.type ===
                    'password'
                ) {

                    confirmPasswordInput.type =
                        'text';

                    toggleConfirmPassword.textContent =
                        'Sembunyikan';

                } else {

                    confirmPasswordInput.type =
                        'password';

                    toggleConfirmPassword.textContent =
                        'Lihat';

                }

            }
        );

    </script>

</body>

</html>
```
